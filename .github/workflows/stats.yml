name: Update Stats Card

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py

      - name: Commit if changed
        run: |
          git config user.name "Piyush Padmakar Bisoi"
          git config user.email "buildgreat4wld@gmail.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh stats card"
            git push
          fi

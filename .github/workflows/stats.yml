name: Sync Stats Card

# Rebuilds the poster's "GitHub Stats" row (stat tiles + contribution graph) from live
# data and publishes it to the `output` branch (not `main`), so bot updates never show
# up as contributions or clutter history. GitHub's shortest schedule is every 5 minutes;
# the README image is cached for about 5 more, so the profile is at most ~10 minutes behind.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_stats.py --out dist/stats.svg

      - name: Publish to output branch
        if: hashFiles('dist/stats.svg') != ''
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: sync contribution graph"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1E6">
        <animate attributeName="stop-color" values="#FFF1E6;#FFE8F2;#E8F1FF;#FFF1E6" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EDE7FF">
        <animate attributeName="stop-color" values="#EDE7FF;#E0F7F0;#FFF3DB;#EDE7FF" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#7C5CFF" fill-opacity="0.18"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="22"/></clipPath>
    <clipPath id="type">
      <rect x="60" y="168" width="690" height="40">
        <animate attributeName="width" values="0;690;690;0" keyTimes="0;0.4;0.85;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <path id="ring" d="M0,-72 A72,72 0 0 1 0,72 A72,72 0 0 1 0,-72"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- drifting pastel blobs -->
    <g filter="url(#soft)">
      <circle cx="120" cy="60" r="90" fill="#FFB3D1" fill-opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0;40 30;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="280" r="100" fill="#B8F0DD" fill-opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;-50 -20;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="40" r="110" fill="#CBB8FF" fill-opacity="0.65">
        <animateTransform attributeName="transform" type="translate" values="0 0;-30 40;0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="10" r="60" fill="#FFD9A8" fill-opacity="0.6">
        <animateTransform attributeName="transform" type="translate" values="0 0;30 20;0 0" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <!-- floating code doodles -->
    <g font-family="'Courier New', monospace" font-weight="700" font-size="26">
      <text x="560" y="56" fill="#7C5CFF" fill-opacity="0.45">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="640" y="262" fill="#FF6B9D" fill-opacity="0.5">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="470" y="270" fill="#2EC4A6" fill-opacity="0.55">+
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="700" y="60" fill="#FFA35C" fill-opacity="0.6">#
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="36" y="40" fill="#5B8DEF" fill-opacity="0.45">( )
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- name -->
    <text x="60" y="125" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1" fill="#2B2140">Piyush Bisoi</text>

    <!-- hand-drawn underline that draws itself -->
    <path d="M62 148 C 150 164, 220 138, 300 154 S 450 140, 520 152" fill="none" stroke="#FF6B9D" stroke-width="6" stroke-linecap="round" stroke-dasharray="600" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="600;0;0;600" keyTimes="0;0.25;0.85;1" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- typewriter subtitle -->
    <g clip-path="url(#type)">
      <text x="60" y="196" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="#5B3DF5">&gt; App Developer · AI Engineer · FDE<tspan fill="#FF6B9D">_</tspan></text>
    </g>

    <!-- skill chips -->
    <g font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2140">
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.20;0.25;0.85;1" dur="8s" repeatCount="indefinite"/>
        <rect x="60" y="226" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="#7C5CFF" stroke-width="1.5"/>
        <text x="113" y="247">Kotlin</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.26;0.31;0.85;1" dur="8s" repeatCount="indefinite"/>
        <rect x="178" y="226" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="#FF6B9D" stroke-width="1.5"/>
        <text x="231" y="247">Flutter</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.32;0.37;0.85;1" dur="8s" repeatCount="indefinite"/>
        <rect x="296" y="226" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="#2EC4A6" stroke-width="1.5"/>
        <text x="349" y="247">Python</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.43;0.85;1" dur="8s" repeatCount="indefinite"/>
        <rect x="414" y="226" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="#FFA35C" stroke-width="1.5"/>
        <text x="467" y="247">FastAPI</text>
      </g>
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.44;0.49;0.85;1" dur="8s" repeatCount="indefinite"/>
        <rect x="532" y="226" width="106" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.85" stroke="#5B8DEF" stroke-width="1.5"/>
        <text x="585" y="247">LLMs</text>
      </g>
    </g>

    <!-- rotating "open to collaborate" badge -->
    <g transform="translate(850 150)">
      <circle r="100" fill="#FFFFFF" fill-opacity="0.55" stroke="#7C5CFF" stroke-opacity="0.3" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
        <text font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#2B2140" letter-spacing="2">
          <textPath href="#ring" xlink:href="#ring" textLength="440" lengthAdjust="spacing">OPEN TO COLLABORATE · BUILD · SHIP · LEARN · </textPath>
        </text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="0" cy="-100" r="6" fill="#FF6B9D" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1;1.1;1" dur="3s" repeatCount="indefinite"/>
        <circle r="46" fill="#7C5CFF"/>
        <text y="9" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="800" fill="#FFFFFF">&lt;/&gt;</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="998" height="298" rx="22" fill="none" stroke="#7C5CFF" stroke-opacity="0.22" stroke-width="2"/>
</svg>

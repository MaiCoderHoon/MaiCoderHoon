<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff5da2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 12 Q125 0 250 12 T500 12 T750 12 T1000 12" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#f)">
    <animate attributeName="d"
      values="M0 12 Q125 0 250 12 T500 12 T750 12 T1000 12;
              M0 12 Q125 24 250 12 T500 12 T750 12 T1000 12;
              M0 12 Q125 0 250 12 T500 12 T750 12 T1000 12"
      dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#fff" filter="url(#f)">
    <animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;12" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
